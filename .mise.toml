#:schema https://mise.jdx.dev/schema/mise.json
#
# Local development toolchain for the Kamishibai triage board.
# Everything needed to build and run the app on a Mac is declared here.
#
#   mise install     # install the pinned toolchains
#   mise run dev     # run backend + frontend together
#   mise tasks       # list every available task

[tools]
go = "1.27"
node = "26"

[env]
# Period boundaries (daily/weekly/monthly/quarterly/annual rollovers) are
# evaluated in this timezone. The whole team shares it.
KAMISHIBAI_TIMEZONE = "America/New_York"

# Local backend address. The Vite dev server proxies API calls here.
KAMISHIBAI_HTTP_ADDR = "127.0.0.1:8090"

# ---------------------------------------------------------------------------
# Composite tasks
# ---------------------------------------------------------------------------

[tasks.dev]
description = "Run the backend and the frontend dev server together"
depends = ["backend:serve", "frontend:dev"]

[tasks.setup]
description = "Install all dependencies (Go modules + npm packages)"
depends = ["backend:deps", "frontend:deps"]

[tasks.test]
description = "Run the full test suite (backend + frontend)"
depends = ["backend:test", "frontend:test", "frontend:storybook:test"]

[tasks.lint]
description = "Vet/lint both workspaces"
depends = ["backend:vet", "frontend:lint"]

[tasks.check]
description = "Everything CI runs: lint + tests + builds"
depends = ["lint", "test", "build", "frontend:storybook:build"]

[tasks.build]
description = "Build production artifacts for both workspaces"
depends = ["frontend:build", "backend:build"]

# ---------------------------------------------------------------------------
# Backend (PocketBase / Go)
# ---------------------------------------------------------------------------

[tasks."backend:deps"]
description = "Download Go module dependencies"
dir = "backend"
run = "go mod download"

[tasks."backend:serve"]
description = "Start the PocketBase backend (applies migrations on boot)"
dir = "backend"
run = "go run . serve --http=$KAMISHIBAI_HTTP_ADDR"

[tasks."backend:build"]
description = "Compile the backend into a single binary at backend/dist/kamishibai"
dir = "backend"
run = "go build -trimpath -o dist/kamishibai ."

[tasks."backend:test"]
description = "Run Go unit tests"
dir = "backend"
run = "go test ./..."

[tasks."backend:test:race"]
description = "Run Go unit tests with the race detector (what CI runs)"
dir = "backend"
run = "go test -race ./..."

[tasks."backend:test:cover"]
description = "Run Go unit tests with a coverage summary"
dir = "backend"
run = ["go test -coverprofile=coverage.out ./...", "go tool cover -func=coverage.out | tail -1"]

[tasks."backend:vet"]
description = "Run go vet"
dir = "backend"
run = "go vet ./..."

[tasks."backend:fmt"]
description = "Format Go sources"
dir = "backend"
run = "go fmt ./..."

# --- migrations ------------------------------------------------------------

[tasks."migrate:up"]
description = "Apply all pending database migrations"
dir = "backend"
run = "go run . migrate up"

[tasks."migrate:down"]
description = "Revert the last applied migration (override count with: mise run migrate:down -- 2)"
dir = "backend"
run = "go run . migrate down"

[tasks."migrate:create"]
description = "Create a blank migration file (usage: mise run migrate:create -- add_widget_field)"
dir = "backend"
run = "go run . migrate create"

[tasks."migrate:status"]
description = "Show which migrations have been applied"
dir = "backend"
run = "go run . migrate history-sync"

# --- seeding ---------------------------------------------------------------

[tasks.seed]
description = "Seed repeatable demo data (idempotent; safe to re-run)"
dir = "backend"
run = "go run . seed"

[tasks."seed:reset"]
description = "Wipe seeded data and re-seed from scratch"
dir = "backend"
run = "go run . seed --reset"

[tasks."db:reset"]
description = "Delete the local database entirely, then migrate and seed a fresh one"
dir = "backend"
run = ["rm -rf pb_data", "go run . migrate up", "go run . seed"]

[tasks."db:backup"]
description = "Archive pb_data into pb_data/backups"
dir = "backend"
run = "go run . backup"

# ---------------------------------------------------------------------------
# Frontend (React / Vite)
# ---------------------------------------------------------------------------

[tasks."frontend:deps"]
description = "Install npm packages"
dir = "frontend"
run = "npm install"

[tasks."frontend:dev"]
description = "Start the Vite dev server"
dir = "frontend"
run = "npm run dev"

[tasks."frontend:build"]
description = "Build the production frontend bundle into backend/pb_public"
dir = "frontend"
run = "npm run build"

[tasks."frontend:test"]
description = "Run frontend unit tests once (no watch mode)"
dir = "frontend"
run = "npm run test"

[tasks."frontend:lint"]
description = "Typecheck the frontend"
dir = "frontend"
run = "npm run lint"

[tasks."frontend:storybook"]
description = "Start Storybook on http://localhost:6006"
dir = "frontend"
run = "npm run storybook"

[tasks."frontend:storybook:build"]
description = "Build Storybook as a static site into frontend/storybook-static"
dir = "frontend"
run = "npm run build-storybook"

[tasks."frontend:storybook:test"]
description = "Render every story in headless Chromium and run the play functions"
dir = "frontend"
run = "npm run test:storybook"

[tasks."frontend:storybook:browsers"]
description = "Install the Chromium build the story tests use (once per machine)"
dir = "frontend"
run = "npx playwright install chromium"

# ---------------------------------------------------------------------------
# Container and deployment
# ---------------------------------------------------------------------------

[tasks."docker:build"]
description = "Build the production container image"
run = "docker build -t kamishibai:local ."

[tasks."docker:run"]
description = "Run the production image locally on port 8090 with a throwaway volume"
run = """
docker run --rm -p 8090:8090 \
  -v kamishibai-local-data:/app/pb_data \
  -e KAMISHIBAI_TIMEZONE=America/New_York \
  kamishibai:local
"""

# kubectl is pulled on demand rather than declared in [tools], so that a
# frontend-only contributor running `mise install` does not have to download it,
# and so CI needs nothing preinstalled on the runner.
[tasks."k8s:render"]
description = "Render the Kubernetes manifests without applying them"
run = "mise exec kubectl@1.36 -- kubectl kustomize deploy/k8s"

[tasks."k8s:diff"]
description = "Show what applying the manifests would change in the current context"
run = "mise exec kubectl@1.36 -- kubectl diff -k deploy/k8s"

# ---------------------------------------------------------------------------
# Continuous integration
# ---------------------------------------------------------------------------
#
# The ci:* tasks live in .mise/tasks/ci/ as shell scripts, because they need a
# real bash shebang for argument handling. Run `mise tasks` to see them.
#
#   mise run ci:local    execute .github/workflows/ci.yml via act, as a PR
#   mise run ci:push     the same, as a push event
#   mise run ci:list     list the workflow's jobs
