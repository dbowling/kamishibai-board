apiVersion: v1
kind: ConfigMap
metadata:
  name: kamishibai-config
  labels:
    app.kubernetes.io/name: kamishibai
data:
  # The instance default timezone. Period boundaries are evaluated in each team's
  # own timezone, and a team that has not set one uses this. A daily card flips at
  # midnight in its team's zone, and a weekly card on Monday there, for everyone
  # on the board regardless of where they are.
  #
  # Changing this after data exists does not rewrite history: past occurrences
  # keep the period keys they were filed under, and rollups keep the boundaries
  # they were computed with.
  timezone: America/New_York

  # When the reporting rollup job runs, interpreted in the timezone above. Every
  # cadence rolls over at local midnight, and teams can have different timezones,
  # so the job runs hourly: each team's closed periods are rolled up within about
  # an hour of its own midnight. It is an idempotent upsert, so the extra runs are
  # cheap.
  rollupCron: "10 * * * *"

  # How many closed periods the job re-checks on each run. This is what lets it
  # recover from downtime: if the pod was away for a week, the next run fills the
  # gap rather than leaving permanent holes in the history.
  rollupLookback: "14"
---
apiVersion: v1
kind: Service
metadata:
  name: kamishibai
  labels:
    app.kubernetes.io/name: kamishibai
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kamishibai
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
